# Reads ./schema.gql (a snapshot of the reference backend's schema). To target
# your own backend, replace ./schema.gql with your server's generated schema,
# then run `npm run codegen`.
schema: ./schema.gql
generates:
  ./lib/generated/graphql-types.ts:
    plugins:
      - typescript
    config:
      # codegen-typescript 6 types custom scalars as unknown; keep DateTime as
      # it has always been typed so consumers do not change with the tool.
      defaultScalarType: any
