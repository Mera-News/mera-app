type Query {
  allCountries: [String!]!

  """
  Static client config: the version stamps of the currently published Terms of Service and Privacy Policy. Unguarded — fetched pre-paywall.
  """
  appConfig: AppConfig!
  appVersionInfo(platform: AppPlatform!): AppVersionInfo!

  """
  Fetch a single article by ID. Returns null if not found (e.g. TTL’d out).
  """
  articleById(id: ID!): NewsArticle
  articleIdsForPersona(query: PersonaQueryInput!): PersonaQueryResult!
  articleIdsForTopics(limitPerTopic: Int! = 20, topics: [TopicPaginationInput!]!): ArticleIdsForTopicsResponse!

  """
  A country's last-24h articles across all its sources, sorted by largest cluster size (top headlines). A null or "GLOBAL" countryCode spans all countries.
  """
  articlesForCountry(
    """Cursor to fetch items after"""
    after: String

    """ISO country code, or null/"GLOBAL" for all countries"""
    countryCode: String

    """Number of items to fetch"""
    first: Int = 20
  ): ArticlesForPublicationSourceResponse!
  articlesForPublicationSource(
    """Cursor to fetch items after"""
    after: String

    """Number of items to fetch"""
    first: Int = 20
    publicationSourceId: ID!
  ): ArticlesForPublicationSourceResponse!

  """
  A publisher's last-24h articles aggregated across all its feeds, sorted by largest cluster size (top headlines).
  """
  articlesForPublisher(
    """Cursor to fetch items after"""
    after: String

    """Number of items to fetch"""
    first: Int = 20
    newsPublisherId: ID!
  ): ArticlesForPublicationSourceResponse!

  """
  Hydrate articles by id for followed ("tracked") stories. Identical payload to articlesForTopicsByIds, but deliberately NOT charged against the daily article cap — following a story must not consume the allowance. dailyLimitReached is always false and resetAt is always absent. Capped at 50 ids per request.
  """
  articlesForStories(articleIds: [ID!]!): ArticlesForTopicsByIdsResponse!
  articlesForTopicsByIds(articleIds: [ID!]!): ArticlesForTopicsByIdsResponse!

  """
  Stateless embedding proxy: embeds short phrases as `retrieval.query` and returns the packed sign-bit sidecars, in the same representation as `vector_sidecar_packed` on articles, so the device can compare them locally. NOTHING IS STORED — no phrase, vector, or caller is persisted, cached, or logged anywhere. At most 16 phrases of 200 characters per call.
  """
  embedPhrases(
    """Phrases to embed. Results are returned aligned to this order."""
    phrases: [String!]!
  ): PhraseEmbeddingResult!

  """
  The fact check for an article. Returns the cached row instantly when one exists (in any state); creates a `pending` one and starts the job when none does. Poll until `status` is complete / blocked / failed. Null means no check exists and none could be started (the article is no longer servable). Always read `checkedBy` together with `checkedByStatus` — an empty list only means "nobody has published" when the status is `searched`.
  """
  factCheck(articleId: ID!): FactCheck

  """
  The versioned feedback tree. Pass the version you already hold as currentVersion to get a not-modified (empty treeJson) response.
  """
  feedbackTree(currentVersion: Int): FeedbackTreeResponse

  """
  The live cluster an article currently belongs to (via its newest cluster-article-link). Null when the article is unclustered or its cluster has aged out. The app uses this to read a story cluster's member articles (e.g. to ground the follow-a-story scope proposals).
  """
  newsClusterForArticle(articleId: ID!): NewsCluster
  newsClusterForUser(clusterId: ID!): NewsCluster!
  newsClusters(
    """Cursor to fetch items after"""
    after: String
    countryCodes: [String!]

    """Number of items to fetch"""
    first: Int = 20
  ): NewsClustersResponse!
  newsClustersForTopicText(after: String, first: Int = 20, topicText: String!): NewsClustersResponse!
  newsPublishers(
    """Cursor to fetch items after"""
    after: String
    countryCode: String

    """Number of items to fetch"""
    first: Int = 20
  ): NewsPublishersResponse!

  """
  Typeahead place search (anchored prefix on the lowercase key, population desc). Returns [] for queries under 2 chars; limit capped at 15.
  """
  placeSearch(limit: Int! = 8, query: String!): [Place!]!
  publicationSources(
    """Cursor to fetch items after"""
    after: String
    category: String
    countryCode: String

    """Number of items to fetch"""
    first: Int = 20
    languageCode: String
  ): PublicationSourcesResponse! @deprecated(reason: "Use newsPublishers and publicationSourcesForNewsPublisher queries instead")
  publicationSourcesForNewsPublisher(publisherId: ID!): PublicationSourcesForPublisherResponse!
  recentArticleCount: Int!
  relatedArticles(articleId: ID!, stableClusterId: String): [ArticleSummary!]!

  """Vector search using cosine similarity (scores 0–1)."""
  searchArticlesVector(
    """Only include articles published within this many hours (e.g. 48)"""
    cutoffHours: Int

    """Max results to return"""
    limit: Int = 10

    """Minimum cosine similarity score (0–1)"""
    minScore: Float = 0

    """Number of candidates for vector search pre-filter"""
    numCandidates: Int = 5000

    """Search text"""
    query: String!
  ): EmbeddingSearchResponse!

  """
  Semantic search over the last 48h of articles. Headline-only results — hydrate ids via articlesForTopicsByIds. Capped at 25 results.
  """
  searchNews(
    """Max results, clamped to 25."""
    limit: Int
    query: String!
  ): [NewsSearchHit!]!
  searchPublishers(
    """Cursor to fetch items after"""
    after: String

    """Number of items to fetch"""
    first: Int = 20
    query: String!
  ): SearchPublishersResponse!

  """
  A country's precomputed, cluster-deduplicated top headlines (each big story appears once), paged over the materialized edition. A null or "GLOBAL" countryCode spans all countries. Falls back to the live path (editionBuiltAt: null) when no edition exists yet.
  """
  topHeadlinesForCountry(
    """Cursor to fetch items after"""
    after: String

    """ISO country code, or null/"GLOBAL" for all countries"""
    countryCode: String

    """Number of items to fetch"""
    first: Int = 20
  ): TopHeadlinesForCountryResponse!
  unblockRequestStatus(userId: ID!): UnblockRequest
  userBilling: UserBillingInfo!
  userPersonaByUserId(userId: ID!): UserPersona
}

