"""
A cached, cross-user fact check keyed on the article URL. Poll until status is complete / blocked / failed.
"""
type FactCheck {
  _id: ID!
  articleTitle: String

  """Canonical, safe-to-open article URL."""
  articleUrl: String

  """Provider calls issued for this row."""
  attempts: Int!

  """
  Established fact-checking organisations that have covered this claim, from the ClaimReview index (never from a model, so an organisation here cannot be invented). An EMPTY list is a real answer — but ONLY when `checkedByStatus` is `searched`. Read the two together, always.
  """
  checkedBy: [FactCheckOrganisation!]!

  """
  Whether the ClaimReview index was actually consulted: `searched` or `unavailable`. THIS IS NOT COSMETIC. `searched` with an empty `checkedBy` means WE LOOKED AND NOBODY HAS PUBLISHED — the normal case, and a real answer worth showing. `unavailable` means WE COULD NOT LOOK (disabled, rate-limited, timed out) and must NEVER be rendered as "nobody has published". The two are byte-identical in `checkedBy`, which is why this is a stored field and not something a client may infer from the array being empty.
  """
  checkedByStatus: String!
  citations: [FactCheckCitation!]!
  claims: [FactCheckClaim!]!
  completedAt: DateTime
  createdAt: DateTime!

  """Model that answered, after failover."""
  model: String
  publicationName: String

  """
  Lifecycle: pending | running | complete | failed | blocked. `complete` and `blocked` are terminal.
  """
  status: String!
  summary: String

  """
  supported | disputed | unsupported | mixed | unverifiable. Present once complete.
  """
  verdict: String
}

"""
A grounding source. `uri` is a Google redirect wrapper, stored verbatim.
"""
type FactCheckCitation {
  snippet: String
  title: String
  uri: String!
}

"""One checkable assertion lifted out of the article."""
type FactCheckClaim {
  assessment: String!
  claim: String!
  note: String
}

"""
An established fact-checking organisation that has published on this claim, with its OWN verdict quoted verbatim (never mapped onto the FactCheck verdict vocabulary).
"""
type FactCheckOrganisation {
  """Organisation name, e.g. "Full Fact", "Alt News"."""
  organisation: String!
  summary: String

  """Link to that organisation's own fact check."""
  url: String

  """
  That organisation's own rating in its own words ("False", "Pants on Fire", "Misleading", ...). NOT one of the FactCheck verdict values.
  """
  verdict: String
}

