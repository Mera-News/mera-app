name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # The animation contract: canvas, transparency, palette, size ceiling,
    # vector-only, the middle-70 safe area, loop seam closure, and frame 0 being
    # the composition at rest. See assets/animations/README.md for what the gate
    # decides and scripts/animations/README.md for the tooling.
    #
    # It runs here, early, because it needs neither node_modules nor .env and so
    # fails fast. It is also the ONLY place these checks run: the jest mirror in
    # components/custom/processing/__tests__/animation-assets.test.ts covers a
    # subset and cannot evaluate a layer's opacity at a frame. Before this step
    # existed the whole contract was guarded by a script somebody had to
    # remember to type.
    #
    # python3 is on the ubuntu-latest runner image (3.12.3). If it ever is not,
    # this fails loudly with a non-zero exit rather than skipping silently.
    - name: Check animation assets
      run: npm run check:animations

    # `expo lint` reads .env via the expo CLI. Provide the committed example so
    # the lint step has the EXPO_PUBLIC_* vars it expects (no live endpoints are
    # contacted — the test step below uses jest-expo mocks).
    - name: Seed .env for lint
      run: cp .env.example .env

    - name: Run lint
      run: npm run lint

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run tests with coverage
      run: npm run test:coverage

  # A dev-only test-account token must never reach a release bundle
  # (lib/device-auth.ts reads it under __DEV__, scripts/ota-publish.js gates
  # every OTA on it). The release export must drop a canary token; the dev
  # export must keep it, which proves the canary reached the bundle at all.
  # EXPO_NO_DOTENV: env comes from the sourced example plus the canary only.
  ota-leak-canary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Release export drops the test-account token, dev export keeps it
      run: |
        set -a; . ./.env.example; EXPO_PUBLIC_TEST_ACCOUNT_TOKEN=mera_tsk_ci_CANARY; set +a
        EXPO_NO_DOTENV=1 npx expo export --output-dir dist-release --platform ios
        EXPO_NO_DOTENV=1 npx expo export --dev --output-dir dist-dev --platform ios
        node scripts/ota-publish.js --scan dist-release
        if node scripts/ota-publish.js --scan dist-dev; then
          echo "The dev export lacks the canary, so the release check proves nothing"; exit 1
        fi
