# Flip Lite mode in Display settings and see the flip persist across an app restart.
# Polarity-agnostic: Lite's default follows the device (on below 6 GB RAM), so the flow reads the
# starting state, taps, and asserts the opposite right after the tap and again after a restart.
# lite-after-tap must show the switch, not the Mera chat sheet (a tap that hit the floating Mera
# button once passed this flow without flipping anything).
# Prerequisites: scripts/e2e-android.sh (mock backend, emulator, e2e APK installed).
appId: ${APP_ID}
---
- runScript: scripts/reset-scenario.js
- runFlow: flows/sign-in.yaml
- runFlow: flows/open-display-via-settings.yaml
- takeScreenshot: lite-before
- evalScript: ${output.liteStart = 'unknown'}
- runFlow:
    when:
      visible:
        id: "lite-mode-switch"
        checked: true
    commands:
      - evalScript: ${output.liteStart = 'on'}
- runFlow:
    when:
      visible:
        id: "lite-mode-switch"
        checked: false
    commands:
      - evalScript: ${output.liteStart = 'off'}
- assertTrue: ${output.liteStart != 'unknown'}
- tapOn:
    id: "lite-mode-switch"
- takeScreenshot: lite-after-tap
- runFlow:
    when:
      true: ${output.liteStart == 'on'}
    commands:
      - assertVisible:
          id: "lite-mode-switch"
          checked: false
- runFlow:
    when:
      true: ${output.liteStart == 'off'}
    commands:
      - assertVisible:
          id: "lite-mode-switch"
          checked: true
- stopApp
- launchApp
- runFlow: flows/open-display-via-settings.yaml
- takeScreenshot: lite-after-restart
- runFlow:
    when:
      true: ${output.liteStart == 'on'}
    commands:
      - assertVisible:
          id: "lite-mode-switch"
          checked: false
- runFlow:
    when:
      true: ${output.liteStart == 'off'}
    commands:
      - assertVisible:
          id: "lite-mode-switch"
          checked: true
