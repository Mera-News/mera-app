# Flip Lite mode in Display settings and see it persist across an app restart.
# The expected polarity of lite-mode-switch is fixed later on device.
# Prerequisites: scripts/e2e-android.sh (mock backend, emulator, e2e APK installed).
appId: ${APP_ID}
---
- runScript: scripts/reset-scenario.js
- runFlow: flows/sign-in.yaml
# The fourth native tab (You), tapped the way a person does: NativeTabs triggers carry no label
# on Android. A deep link into this tab left its pages out of the accessibility tree (D4).
- tapOn:
    id: ".*navigation_bar_item_icon_view"
    index: 3
- tapOn:
    id: "page-pill-settings"
- tapOn:
    id: "settings-row-display"
- tapOn:
    id: "lite-mode-switch"
- takeScreenshot: lite-after-tap
- stopApp
- launchApp
# The fourth native tab (You), tapped the way a person does: NativeTabs triggers carry no label
# on Android. A deep link into this tab left its pages out of the accessibility tree (D4).
- tapOn:
    id: ".*navigation_bar_item_icon_view"
    index: 3
- tapOn:
    id: "page-pill-settings"
- tapOn:
    id: "settings-row-display"
- takeScreenshot: lite-after-restart
- assertVisible:
    id: "lite-mode-switch"
    checked: true
