# Subflow: first launch to the Feed through Get started (device sign-in); the mock backend answers the
# device sign-in with its fixture account. Needs Play services on the AVD (Play Integrity token).
# Provisional: the screen order is fixed from the discovery run.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "auth-begin-without-email"
    timeout: 30000
- tapOn:
    id: "auth-begin-without-email"
- extendedWaitUntil:
    visible:
      id: "auth-consent-agree"
    timeout: 30000
- tapOn:
    id: "auth-consent-agree"
# Agree is the sign-in, and consent was accepted with it, so no gate here.
# Onboarding step 1: tell Mera one interest and add the offered fact. A zero-fact Feed requests no
# articles (D2), so this is what gives the Feed cards. The mock's default responder scripts the
# turn ("I follow ..." -> facts/interest -> saveExtractedFacts) and the topic generation.
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 30000
- tapOn:
    id: "chat-input"
- inputText: "I follow Formula 1 racing"
- tapOn:
    id: "chat-send"
- extendedWaitUntil:
    visible:
      id: "fact-choice-add-.*"
    timeout: 60000
- tapOn:
    id: "fact-choice-add-.*"
# No hideKeyboard: on Android it presses BACK, which closed the app when no keyboard was up.
# Next rides beside the composer, so it stays reachable with the keyboard open.
- tapOn:
    id: "onboarding-next"
# Step 2 is the sources step (Skip with no picks); Next stays on screen across the switch.
- extendedWaitUntil:
    notVisible:
      id: "onboarding-facts-count"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "onboarding-sources-step"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-remind"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-guard-notifications-secondary"
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 60000
