# Subflow: first launch to the Feed through Get started (device sign-in); the mock backend answers the
# device sign-in with its fixture account. lib/e2e/device-attest.ts answers attestation in this build.
# Provisional: the screen order is fixed from the discovery run.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "auth-begin-without-email"
    timeout: 30000
- tapOn:
    id: "auth-begin-without-email"
- extendedWaitUntil:
    visible:
      id: "auth-consent-agree"
    timeout: 30000
- tapOn:
    id: "auth-consent-agree"
# Agree is the sign-in, and consent was accepted with it, so no gate here.
# Onboarding step 1: Next stays disabled until there is one fact (D2). The home-country chip saves
# a residence fact in one tap with no chat turn, and a residence fact gives the Feed its country.
- extendedWaitUntil:
    visible:
      id: "home-country-chip"
    timeout: 30000
- tapOn:
    id: "home-country-chip"
- extendedWaitUntil:
    visible:
      id: "onboarding-next"
      enabled: true
    timeout: 30000
- tapOn:
    id: "onboarding-next"
# Step 2 is the sources step (Skip with no picks); Next stays on screen across the switch.
- extendedWaitUntil:
    notVisible:
      id: "onboarding-facts-count"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "onboarding-sources-step"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-remind"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-guard-notifications-secondary"
# A finished wizard lands on the Feed (D3), with the first sync running behind it
# (handleComplete in app/logged-in/onboarding.tsx).
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 60000
