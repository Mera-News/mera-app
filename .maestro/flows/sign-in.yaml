# Subflow: first launch to the Feed with the mock backend's fixture account and fixed OTP.
# Provisional: the screen order is fixed from the discovery run.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "auth-begin-mera"
    timeout: 30000
- tapOn:
    id: "auth-begin-mera"
- extendedWaitUntil:
    visible:
      id: "auth-checks-continue"
      enabled: true
    timeout: 30000
- tapOn:
    id: "auth-checks-continue"
- extendedWaitUntil:
    visible:
      id: "auth-begin-with-email"
    timeout: 30000
- tapOn:
    id: "auth-begin-with-email"
- extendedWaitUntil:
    visible:
      id: "auth-consent-agree"
    timeout: 30000
- tapOn:
    id: "auth-consent-agree"
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 30000
- tapOn:
    id: "auth-email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "auth-send-otp"
- extendedWaitUntil:
    visible:
      id: "auth-otp-boxes"
    timeout: 30000
- tapOn:
    id: "auth-otp-boxes"
- inputText: ${OTP}
# Consent was accepted on the auth screen (auth-consent-agree), so no gate here.
# Onboarding step 1 (chat) with zero facts, then step 2 (notifications) left off.
- extendedWaitUntil:
    visible:
      id: "onboarding-next"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-guard-facts-secondary"
# Step 2 is the one without the facts counter; Next stays on screen across the switch.
- extendedWaitUntil:
    notVisible:
      id: "onboarding-facts-count"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-guard-notifications-secondary"
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 60000
