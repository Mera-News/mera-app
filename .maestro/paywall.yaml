# A user with no plan sees the plan card and the manage-plan row in Settings.
# Prerequisites: scripts/e2e-android.sh (mock backend, emulator, e2e APK installed).
appId: ${APP_ID}
---
- runScript: scripts/reset-scenario.js
- runScript:
    file: scripts/set-scenario.js
    env:
      SCENARIO: '{"tier":"none"}'
- runFlow: flows/sign-in.yaml
# The fourth native tab (You), tapped the way a person does: NativeTabs triggers carry no label
# on Android. A deep link into this tab left its pages out of the accessibility tree (D4).
- tapOn:
    id: ".*navigation_bar_item_icon_view"
    index: 3
- tapOn:
    id: "page-pill-settings"
- extendedWaitUntil:
    visible:
      id: "settings-plan-card"
    timeout: 30000
- assertVisible:
    id: "settings-manage-plan"
- takeScreenshot: settings-no-plan
