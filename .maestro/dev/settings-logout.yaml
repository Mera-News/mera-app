# Dev flow: Settings > Language opens its sheet and goes back with no selection, then Settings >
# Log out (signOutAndWipe) returns to the auth screen. Log out runs last: it ends the session.
# Never switch the app language on a device or emulator in this lane (owner ruling): the switch
# logic is covered by language-switch-sheet.test.ts.
appId: ${APP_ID}
---
- runScript: ../scripts/reset-scenario.js
- runFlow: ../flows/sign-in.yaml
- tapOn:
    id: ".*navigation_bar_item_icon_view"
    index: 3
- tapOn:
    id: "page-pill-settings"
- scrollUntilVisible:
    element:
      id: "settings-row-language"
    direction: DOWN
- tapOn:
    id: "settings-row-language"
- extendedWaitUntil:
    visible:
      id: "language-option-en"
    timeout: 15000
- takeScreenshot: language-sheet
- tapOn:
    id: "language-back"
- scrollUntilVisible:
    element:
      id: "settings-row-logout"
    direction: DOWN
- assertVisible:
    text: "Log out"
- tapOn:
    id: "settings-row-logout"
- extendedWaitUntil:
    visible:
      id: "app-dialog-confirm"
    timeout: 15000
- takeScreenshot: logout-confirm
- tapOn:
    id: "app-dialog-confirm"
- extendedWaitUntil:
    visible:
      id: "auth-screen"
    timeout: 30000
- takeScreenshot: logout-auth-screen
