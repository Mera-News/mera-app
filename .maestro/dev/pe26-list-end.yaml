# Dev flow: PE26, a You-tab scroll page clears the floating Mera button at its end, so every row can
# be scrolled out from under it. Captures Display, Settings, Notifications, Manage subscription and
# Facts scrolled to the end (pe26-*-end: the last row's right edge must sit above the Mera button;
# judged by eye with persona's contracts test as the gate), and taps Display's last row, which must
# open System check, not the chat.
# Red until persona's PE26 fix lands. Run in the P4-end device run.
appId: ${APP_ID}
---
- runScript: ../scripts/reset-scenario.js
- runFlow: ../flows/sign-in.yaml
- tapOn:
    id: ".*navigation_bar_item_icon_view"
    index: 3
- tapOn:
    id: "page-pill-settings"
- tapOn:
    id: "settings-row-display"
- scrollUntilVisible:
    element:
      id: "system-check-open"
    direction: DOWN
- swipe:
    direction: UP
- takeScreenshot: pe26-display-end
- tapOn:
    id: "system-check-open"
- extendedWaitUntil:
    visible:
      id: "settings-system-check"
    timeout: 15000
- assertNotVisible:
    id: "chat-input"

# The other You-tab pages, each scrolled to its end. Back is the Android back key.
- back
- back
- extendedWaitUntil:
    visible:
      id: "settings-page"
    timeout: 15000
- runFlow:
    file: ../flows/end-capture.yaml
    env: { SHOT: pe26-settings-end }
- scrollUntilVisible:
    element:
      id: "settings-row-notifications"
    direction: UP
- tapOn:
    id: "settings-row-notifications"
- runFlow:
    file: ../flows/end-capture.yaml
    env: { SHOT: pe26-notifications-end }
- back
- scrollUntilVisible:
    element:
      id: "settings-manage-plan"
    direction: UP
- tapOn:
    id: "settings-manage-plan"
- extendedWaitUntil:
    visible:
      id: "manage-view-plans"
    timeout: 15000
- runFlow:
    file: ../flows/end-capture.yaml
    env: { SHOT: pe26-manage-subscription-end }
- back
- tapOn:
    id: "page-pill-profile"
- tapOn:
    id: "profile-facts-view-all"
- runFlow:
    file: ../flows/end-capture.yaml
    env: { SHOT: pe26-facts-end }
