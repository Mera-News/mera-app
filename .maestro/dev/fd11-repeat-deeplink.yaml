# Dev flow: deep links into the legacy stub routes. The FIRST link to /logged-in/preferences/display
# must open Display (hard check). The repeat, away-and-back and legacy-redirect cases are the parked
# FD11 gap (R87, IDENTIFIED_GAPS.md: a repeated link lands on the You tab root): they are recorded
# only, as optional waits whose commands.json status is COMPLETED (opened) or WARNED (did not), each
# with a screenshot. Each recorded link is preceded by a settle (an optional wait on an id that never
# appears) so its check cannot read the screen from before the link took effect. set-display relaunches
# before every link for this reason.
appId: ${APP_ID}
---
- runScript: ../scripts/reset-scenario.js
- runFlow: ../flows/sign-in.yaml

# The first link opens Display (hard check).
- openLink: ${SCHEME}:///logged-in/preferences/display
- extendedWaitUntil:
    visible:
      id: "appearance-switch-dark"
    timeout: 15000
- takeScreenshot: fd11-first-link

# Recorded: the same route again.
- openLink: ${SCHEME}:///logged-in/preferences/display
- extendedWaitUntil:
    visible:
      id: "fd11-settle-never-present"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible:
      id: "appearance-switch-dark"
    timeout: 5000
    optional: true
- takeScreenshot: fd11-rec-a-same-route

# Recorded: away and back (display -> manage-subscription -> display).
- openLink: ${SCHEME}:///logged-in/preferences/manage-subscription
- extendedWaitUntil:
    visible:
      id: "manage-view-plans"
    timeout: 15000
    optional: true
- openLink: ${SCHEME}:///logged-in/preferences/display
- extendedWaitUntil:
    visible:
      id: "fd11-settle-never-present"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible:
      id: "appearance-switch-dark"
    timeout: 5000
    optional: true
- takeScreenshot: fd11-rec-b-away-and-back

# Recorded: through a legacy redirect (/logged-in/sources -> You > Sources).
- openLink: ${SCHEME}:///logged-in/sources
- extendedWaitUntil:
    visible:
      id: "fd11-settle-never-present"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible:
      id: "publication-preferences-screen"
    timeout: 5000
    optional: true
- takeScreenshot: fd11-rec-c-legacy-redirect
