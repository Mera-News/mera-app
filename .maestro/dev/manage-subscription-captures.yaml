# Dev flow: PE6 Manage subscription captures after a scripted purchase. Confirming card in dark,
# light (Lite off) and Lite; timeout card in dark and light; the confirmed state in dark (it stays on Manage plan).
# The paywall is the E2E build's stub (lib/e2e/purchases-ui.ts), answered by the scenario's
# `paywall` block (test/mock-backend/scenario.ts). The confirming card shows from the purchase
# through the whole poll budget (first poll, then 20 x 5 s, ~120 s). With upgradeTo, billing reports
# `individual` 45 s after the purchase and the card flips to confirmed; without it both polls give
# up and the timeout card shows. Testids (persona PE6 screen): manage-confirming-card and
# manage-timeout-card on the cards, manage-activation-pending / -timeout on their titles.
# Run: scripts/e2e-android.sh --skip-build --flows .maestro/dev/manage-subscription-captures.yaml
appId: ${APP_ID}
---
- runScript: ../scripts/reset-scenario.js
- runScript:
    file: ../scripts/set-scenario.js
    env:
      SCENARIO: '{"tier":"starter","purchasedAt":null,"paywall":{"result":"PURCHASED","upgradeTo":"individual","confirmAfterMs":45000}}'
- runFlow: ../flows/sign-in.yaml

# Confirming, dark; then let it confirm so no poll outlives this step.
- runFlow:
    file: ../flows/set-display.yaml
    env: { MODE: dark, LITE: off }
- runFlow:
    file: ../flows/manage-buy.yaml
    env: { CARD: manage-confirming-card, SHOT: pe6-confirming-dark, WAIT: "15000" }
- extendedWaitUntil:
    notVisible:
      id: "manage-confirming-card"
    timeout: 90000
- takeScreenshot: pe6-confirmed-dark

# Confirming, light.
- runScript:
    file: ../scripts/set-scenario.js
    env:
      SCENARIO: '{"tier":"starter","purchasedAt":null,"paywall":{"result":"PURCHASED","upgradeTo":"individual","confirmAfterMs":45000}}'
- runFlow:
    file: ../flows/set-display.yaml
    env: { MODE: light, LITE: off }
- runFlow:
    file: ../flows/manage-buy.yaml
    env: { CARD: manage-confirming-card, SHOT: pe6-confirming-light, WAIT: "15000" }
- extendedWaitUntil:
    notVisible:
      id: "manage-confirming-card"
    timeout: 90000

# Confirming, Lite (dark).
- runScript:
    file: ../scripts/set-scenario.js
    env:
      SCENARIO: '{"tier":"starter","purchasedAt":null,"paywall":{"result":"PURCHASED","upgradeTo":"individual","confirmAfterMs":45000}}'
- runFlow:
    file: ../flows/set-display.yaml
    env: { MODE: dark, LITE: on }
- runFlow:
    file: ../flows/manage-buy.yaml
    env: { CARD: manage-confirming-card, SHOT: pe6-confirming-lite, WAIT: "15000" }
- extendedWaitUntil:
    notVisible:
      id: "manage-confirming-card"
    timeout: 90000

# Timeout, dark: the purchase never confirms.
- runScript:
    file: ../scripts/set-scenario.js
    env:
      SCENARIO: '{"tier":"starter","purchasedAt":null,"paywall":{"result":"PURCHASED","upgradeTo":null,"confirmAfterMs":0}}'
- runFlow:
    file: ../flows/set-display.yaml
    env: { MODE: dark, LITE: off }
- runFlow:
    file: ../flows/manage-buy.yaml
    env: { CARD: manage-timeout-card, SHOT: pe6-timeout-dark, WAIT: "180000" }

# Timeout, light.
- runFlow:
    file: ../flows/set-display.yaml
    env: { MODE: light, LITE: off }
- runFlow:
    file: ../flows/manage-buy.yaml
    env: { CARD: manage-timeout-card, SHOT: pe6-timeout-light, WAIT: "180000" }
